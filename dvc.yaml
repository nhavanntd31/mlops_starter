stages:
  ingest:
    cmd: python src/ingestion/ingest.py
    deps:
      - src/ingestion/ingest.py
      - data/raw/kc_house_data.csv
    params:
      - configs/params.yaml:
          - data.raw_path

  validate:
    cmd: python src/validation/validate.py
    deps:
      - src/validation/validate.py
      - src/ingestion/ingest.py
      - data/raw/kc_house_data.csv

  preprocess:
    cmd: python src/preprocessing/preprocess.py
    deps:
      - src/preprocessing/preprocess.py
      - src/ingestion/ingest.py
      - data/raw/kc_house_data.csv
    outs:
      - data/processed/processed.csv
      - models/label_encoder.pkl
      - models/scaler.pkl

  split:
    cmd: python src/split/split.py
    deps:
      - src/split/split.py
      - data/processed/processed.csv
    params:
      - configs/params.yaml:
          - data.test_size
          - data.val_size
          - data.processed_dir
          - project.random_seed
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
