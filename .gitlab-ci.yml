stages:
  - lint
  - test
  - validate
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install flake8 black isort
    - flake8 src/ app/ tests/ --max-line-length=120 --ignore=E501,W503
    - black --check src/ app/ tests/
    - isort --check-only src/ app/ tests/
  allow_failure: true

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - pip install pytest fastapi pydantic
    - pytest tests/ -v --tb=short
  artifacts:
    reports:
      junit: report.xml
    when: always

validate-config:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install pyyaml
    - python scripts/validate_config.py
  only:
    changes:
      - configs/**/*

validate-model:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python scripts/validate_model.py
  when: manual

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker build -t house-price-api:CI_COMMIT_SHORT_SHA .
    - docker tag house-price-api:CI_COMMIT_SHORT_SHA house-price-api:latest
  only:
    - main
    - master

deploy-staging:
  stage: deploy
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "Deploying to staging..."
    - docker compose -f infra/docker-compose.yml up -d
  environment:
    name: staging
  only:
    - main
    - master
  when: manual
